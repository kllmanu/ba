<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 830" role="img"
    aria-labelledby="title desc">
    <title id="title">BPMN-Prozess zur Erstellung von Prüfungsfragen mit LLM</title>
    <desc id="desc">Lehrende erstellen und prüfen Fragen. Skripte exportieren als QTI; das LLM
        unterstützt bei der Fragenerstellung.</desc>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <path d="M0,0 L10,4 L0,8 Z" fill="#40515f" />
        </marker>
        <style>
      .pool { fill: #fff; stroke: #526575; stroke-width: 2; }
      .lane { fill: #f6f8fa; stroke: #9aa8b3; stroke-width: 1.5; }
    .lane-scripts { fill: #f2f6f7; stroke: #9aa8b3; stroke-width: 1.5; }
      .lane-system { fill: #eef4f6; stroke: #9aa8b3; stroke-width: 1.5; }
      .lane-label { fill: #e5ebef; }
      .user-task { fill: #fff; stroke: #246b78; stroke-width: 2; }
      .service-task { fill: #e2f1f2; stroke: #246b78; stroke-width: 2; }
    .script-task { fill: #f3d9a5; stroke: #986515; stroke-width: 2; }
      .gateway { fill: #fff; stroke: #40515f; stroke-width: 2; }
      .flow { fill: none; stroke: #40515f; stroke-width: 2.2; marker-end: url(#arrow); }
    .label { font: 19px sans-serif; fill: #20313b; text-anchor: middle; }
    .script-label { fill: #2e2618; }
        .lane-title { font: 700 20px sans-serif; fill: #20313b; text-anchor: middle; }
            .flow-label { font: 17px sans-serif; fill: #40515f; }
      .event { fill: #fff; stroke: #40515f; stroke-width: 2.5; }
      .end-event { fill: #fff; stroke: #40515f; stroke-width: 4; }
    </style>
    </defs>
    <rect class="pool" x="30" y="30" width="1740" height="770" />
    <rect class="lane" x="30" y="30" width="1740" height="330" />
    <rect class="lane-scripts" x="30" y="360" width="1740" height="200" />
    <rect class="lane-system" x="30" y="560" width="1740" height="240" />
    <rect class="lane-label" x="30" y="30" width="100" height="330" />
    <rect class="lane-label" x="30" y="360" width="100" height="200" />
    <rect class="lane-label" x="30" y="560" width="100" height="240" />
    <path d="M130 30 V800 M30 360 H1770 M30 560 H1770" stroke="#9aa8b3" stroke-width="1.5"
        fill="none" />
    <text class="lane-title" transform="translate(80 195) rotate(-90)">Lehrende</text>
    <text class="lane-title" transform="translate(80 460) rotate(-90)">Skripte</text>
    <text class="lane-title" transform="translate(80 680) rotate(-90)">LLM</text>

    <g transform="translate(75 0)">
        <path class="flow" d="M96 190 H130" />
        <path class="flow" d="M180 190 H220" />
        <path class="flow" d="M155 215 V660 H220" />
        <path class="flow" d="M360 190 H410 V410" />
        <path class="flow" d="M370 660 H410 V460" />
        <path class="flow" d="M435 435 H450 V190 H470" />
        <path class="flow" d="M615 190 H635" />
        <path class="flow" d="M685 190 H750" />
        <path class="flow" d="M660 215 V275" />
        <path class="flow" d="M685 300 H750" />
        <path class="flow" d="M635 300 V245 H190 V190 H130" />
        <path class="flow" d="M900 300 H950 V490 H460 V435 H435" />
        <path class="flow" d="M890 190 H1230" />
        <path class="flow" d="M1380 190 H1400 V435 H1420" />
        <path class="flow" d="M1570 460 H1620 V432" />

        <text class="flow-label" x="705" y="178">ja</text>
        <text class="flow-label" x="670" y="250">nein</text>
        <text class="flow-label" x="555" y="286">verwerfen</text>

        <circle class="event" cx="78" cy="190" r="18" />
        <path class="gateway" d="M155 165 L180 190 L155 215 L130 190 Z" />
        <path class="gateway" d="M410 410 L435 435 L410 460 L385 435 Z" />
        <path d="M402 427 L418 443 M418 427 L402 443" stroke="#40515f" stroke-width="2" />
        <path class="gateway" d="M660 165 L685 190 L660 215 L635 190 Z" />
        <path d="M652 182 L668 198 M668 182 L652 198" stroke="#40515f" stroke-width="2" />
        <path class="gateway" d="M660 275 L685 300 L660 325 L635 300 Z" />
        <path d="M652 292 L668 308 M668 292 L652 308" stroke="#40515f" stroke-width="2" />
        <rect class="user-task" x="220" y="150" width="140" height="80" rx="10" />
        <text class="label" x="290" y="184">
            <tspan x="290">Frage manuell</tspan>
            <tspan x="290" dy="22">erfassen</tspan>
        </text>
        <rect class="service-task" x="220" y="620" width="150" height="80" rx="10" />
        <text class="label" x="295" y="654">
            <tspan x="295">Frage(n)</tspan>
            <tspan x="295" dy="22">generieren</tspan>
        </text>
        <text class="flow-label" x="390" y="382" text-anchor="middle">Daten bereit</text>
        <rect class="user-task" x="470" y="150" width="145" height="80" rx="10" />
        <text class="label" x="542" y="196">Frage prüfen</text>
        <rect class="user-task" x="750" y="150" width="140" height="80" rx="10" />
        <text class="label" x="820" y="184">
            <tspan x="820">Zum Fragenpool</tspan>
            <tspan x="820" dy="22">hinzufügen</tspan>
        </text>
        <rect class="user-task" x="1230" y="150" width="150" height="80" rx="10" />
        <text class="label" x="1305" y="184">
            <tspan x="1305">Prüfung</tspan>
            <tspan x="1305" dy="22">zusammenstellen</tspan>
        </text>
        <rect class="user-task" x="750" y="265" width="150" height="70" rx="10" />
        <text class="label" x="825" y="306">Bearbeiten</text>
        <rect class="script-task" x="1420" y="420" width="150" height="80" rx="10" />
        <text class="label script-label" x="1495" y="454">
            <tspan x="1495">QTI</tspan>
            <tspan x="1495" dy="22">exportieren</tspan>
        </text>
        <circle class="end-event" cx="1638" cy="432" r="18" />
    </g>
</svg>